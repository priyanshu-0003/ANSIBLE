---
- name: Install Grafana
  hosts: monitoring
  become: yes
  tasks:
    - name: Add Grafana repo
      yum_repository:
        name: grafana
        description: Grafana
        baseurl: https://rpm.grafana.com
        gpgcheck: yes
        gpgkey: https://rpm.grafana.com/gpg.key
        enabled: yes

    - name: Install Grafana
      yum:
        name: grafana
        state: present

    - name: Start Grafana
      systemd:
        name: grafana-server
        state: started
        enabled: yes
